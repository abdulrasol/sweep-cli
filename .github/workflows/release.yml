name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: macos
            targets: dmg
          - os: windows-latest
            platform: windows
            targets: exe
          - os: ubuntu-latest
            platform: linux
            targets: deb,rpm,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev libnotify-dev libsecret-1-dev libayatana-appindicator3-dev rpm
          # Install appimagetool for AppImage builds
          sudo curl -L https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Get dependencies
        run: |
          cd sweep_desktop
          flutter pub get

      - name: Install Flutter Distributor
        run: flutter pub global activate flutter_distributor

      - name: Build & Package Desktop
        run: |
          cd sweep_desktop
          flutter_distributor package --platform=${{ matrix.platform }} --targets=${{ matrix.targets }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sweep-${{ matrix.platform }}
          path: sweep_desktop/dist/*/


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
