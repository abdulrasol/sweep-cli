name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: macos
            targets: dmg
          - os: windows-latest
            platform: windows
            targets: exe
          - os: ubuntu-latest
            platform: linux
            targets: deb,rpm,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev libnotify-dev libsecret-1-dev libayatana-appindicator3-dev rpm
          # Install appimagetool (Correct URL and Extract to bypass FUSE in CI)
          curl -L https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Get dependencies
        run: |
          cd sweep_desktop
          flutter pub get

      - name: Install Flutter Distributor
        run: |
          flutter pub global activate flutter_distributor
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "$APPDATA\Pub\Cache\bin" >> $GITHUB_PATH
          else
            echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          fi
        shell: bash

      - name: Build & Package Desktop
        run: |
          cd sweep_desktop
          # Create metainfo file for RPM
          cp linux/packaging/rpm/sweep.metainfo.xml .
          flutter pub global run flutter_distributor:main package --platform=${{ matrix.platform }} --targets=${{ matrix.targets }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sweep-${{ matrix.platform }}
          path: sweep_desktop/dist/*/

      - name: Generate Checksum
        run: |
          cd sweep_desktop/dist/*/
          shasum -a 256 * > checksum.txt
          echo "SHA256 for $(ls *.zip || ls *.tar.gz || ls *.dmg || ls *.exe):"
          cat checksum.txt
        shell: bash

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to WinGet
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Abdulrasol.Sweep
          installers-regex: '.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
        continue-on-error: true # Allow to fail if WINGET_TOKEN is not set

