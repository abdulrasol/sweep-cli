output: dist/
releases:
  - name: production
    jobs:
      - name: release-macos
        package:
          platform: macos
          target: dmg
          build_args:
            release: true

      - name: release-windows
        package:
          platform: windows
          target: exe
          build_args:
            release: true

      - name: release-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            release: true

      - name: release-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            release: true

      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            release: true
